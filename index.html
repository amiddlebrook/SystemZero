<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Zero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              sys: {
                bg: '#080808',
                surface: '#111111',
                border: '#333333',
                text: '#EEEEEE',
                dim: '#666666',
                accent: '#FF4400', // Safety Orange
                accentDim: 'rgba(255, 68, 0, 0.2)'
              }
            },
            boxShadow: {
              'beam': '0 -10px 40px -10px rgba(255, 68, 0, 0.5)',
              'glow': '0 0 20px rgba(255, 68, 0, 0.15)',
              'depth': '0 20px 50px -10px rgba(0,0,0,0.8)'
            },
            animation: {
              'spin-slow': 'spin 30s linear infinite',
              'spin-reverse-slow': 'spin-reverse 40s linear infinite',
            },
            keyframes: {
              'spin-reverse': {
                'from': { transform: 'rotate(360deg)' },
                'to': { transform: 'rotate(0deg)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #080808;
        color: #EEEEEE;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      
      /* Film Grain */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Dot Grid Texture */
      .dot-grid {
        background-image: radial-gradient(#333 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #111;
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border: 1px solid #080808;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF4400;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
